name: MERN Docker & Nginx CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # JOB 1: Continuous Integration (Build & Lint Check)
    ci-build-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Backend - Install & Build Check
              run: |
                  cd server
                  npm ci
                  npm run build

            - name: Frontend - Install, Lint & Build Check
              run: |
                  cd client
                  npm ci
                  npm run lint || true
                  npm run build

    # JOB 2: Continuous Deployment to AWS EC2
    deploy-to-ec2:
        needs: ci-build-check
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Add EC2 to Known Hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

            - name: SSH Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_KEY }}
                  script: |
                      cd ${{ secrets.EC2_APP_DIR }}
                      git fetch origin main
                      git reset --hard origin/main
                      docker compose up --build -d
