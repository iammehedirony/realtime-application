version: '3.8'

services:
  server:
    build: ./server
    container_name: chat-server
    restart: always
    env_file:
      - ./server/.env
    networks:
      - chat-network

  client:
      build:
        context: ./client
        args:
          - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      container_name: chat-client
      restart: always
      depends_on:
        - server
      networks:
        - chat-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge
